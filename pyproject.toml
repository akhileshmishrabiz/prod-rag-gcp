[project]
name = "prod-rag-gcp"
version = "0.1.0"
description = "Local-first, fixed-tenant development RAG services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.119.0,<0.120.0",
  "pydantic[email]>=2.12.0,<3.0.0",
  "pydantic-settings>=2.11.0,<3.0.0",
  "pypdf>=6.1.1,<7.0.0",
  "uvicorn>=0.37.0,<0.38.0",
  "google-cloud-firestore>=2.21.0,<3",
  "google-cloud-storage>=3.4.0,<4",
  "google-cloud-pubsub>=2.31.0,<3",
  "google-cloud-aiplatform>=1.126.0,<2",
  "google-genai>=1.47.0,<2",
]

[dependency-groups]
dev = [
  "bandit>=1.8.6,<2.0.0",
  "httpx>=0.28.1,<0.29.0",
  "jsonschema[format]>=4.25.1,<5.0.0",
  "mypy>=1.18.2,<2.0.0",
  "openapi-spec-validator>=0.7.2,<0.8.0",
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "ruff>=0.14.0,<0.15.0",
  "types-jsonschema>=4.25.1,<5.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]
"local/tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["services", "packages", "local", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=services --cov=packages --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests", "local/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["services", "packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]
