name: prod-rag-gcp-local

x-runtime-environment: &runtime-environment
  CONFIG_CONTRACT_VERSION: "1.0.0"
  APP_MODE: local
  AUTH_MODE: local_signed
  DEV_TENANT_ID: dev-tenant
  LOCAL_AUTH_SIGNING_KEY_FILE: /run/local-auth/local-auth.key
  GCS_DOCUMENT_BUCKET: rag-local
  TENANT_UPLOAD_PREFIX: tenants/dev-tenant/uploads
  FIXED_CORPUS: default
  PUBSUB_WORKER_AUDIENCE: http://worker:8081/
  PIPELINE_VERSION: pipeline-1
  PARSER_VERSION: parser-1
  CHUNKER_VERSION: chunker-1
  GENERATION_MODEL_ID: deterministic-generator-v1
  EMBEDDING_MODEL_ID: deterministic-embedding-v1
  EMBEDDING_DIMENSIONS: "32"
  MAX_DOCUMENT_BYTES: "10485760"
  MAX_DOCUMENT_CHUNKS: "1000"
  MAX_EMBEDDING_BATCH_SIZE: "100"
  MAX_QUERY_INPUT_CHARS: "4000"
  MAX_QUERY_TOP_K: "20"
  MAX_ACTIVE_GENERATIONS: "1000"
  MAX_CANDIDATES_PER_DOCUMENT: "5"
  MAX_CONTEXT_CHARS: "40000"
  MAX_CONTEXT_TOKENS: "8000"
  MAX_EVIDENCE_CHARS: "6000"
  MAX_OUTPUT_TOKENS: "1024"
  MAX_PDF_PAGES: "200"
  CHUNK_SIZE_TOKENS: "512"
  CHUNK_OVERLAP_TOKENS: "64"
  DEPENDENCY_TIMEOUT_SECONDS: "30"
  PROCESSING_DEADLINE_SECONDS: "600"
  PROCESSING_LEASE_SECONDS: "300"
  MAX_PROCESSING_ATTEMPTS: "5"
  EMBEDDING_MAX_RETRIES: "3"
  WORKER_CONCURRENCY: "4"
  API_MAX_INSTANCES: "2"
  WORKER_MAX_INSTANCES: "2"
  GOOGLE_CLOUD_PROJECT: local-rag-project
  GCLOUD_PROJECT: local-rag-project
  FIRESTORE_EMULATOR_HOST: firestore:8080
  PUBSUB_EMULATOR_HOST: pubsub:8085
  STORAGE_EMULATOR_HOST: http://storage:4443
  LOCAL_METADATA_ENDPOINT: http://firestore:8080
  LOCAL_GCS_ENDPOINT: http://storage:4443
  LOCAL_PUBSUB_ENDPOINT: http://pubsub:8085
  LOCAL_VECTOR_ENDPOINT: http://vertex:8090
  LOCAL_EMBEDDING_ENDPOINT: http://vertex:8090
  LOCAL_GENERATION_ENDPOINT: http://vertex:8090
  PUBSUB_TOPIC: ingestion
  PUBSUB_DLQ_TOPIC: ingestion-dlq
  PUBSUB_SUBSCRIPTION: ingestion-worker
  PUBSUB_DLQ_SUBSCRIPTION: ingestion-dlq-inspect
  PUBSUB_PUSH_PATH: /v1/pubsub/push
  GCE_METADATA_HOST: metadata-blocked.invalid
  GCE_METADATA_IP: 0.0.0.0
  GOOGLE_APPLICATION_CREDENTIALS: ""
  CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ""
  HTTP_PROXY: http://127.0.0.1:9
  HTTPS_PROXY: http://127.0.0.1:9
  NO_PROXY: localhost,127.0.0.1,firestore,pubsub,storage,vertex,push-gateway,worker

x-cloud-endpoint-sinkholes: &cloud-endpoint-sinkholes
  - "metadata.google.internal=127.0.0.1"
  - "metadata.google.com=127.0.0.1"
  - "oauth2.googleapis.com=127.0.0.1"
  - "aiplatform.googleapis.com=127.0.0.1"
  - "us-central1-aiplatform.googleapis.com=127.0.0.1"
  - "firestore.googleapis.com=127.0.0.1"
  - "pubsub.googleapis.com=127.0.0.1"
  - "storage.googleapis.com=127.0.0.1"

services:
  firestore:
    image: google/cloud-sdk:548.0.0-emulators@sha256:bea47bb520e7247125c20498c00bdcfbf40b2cc0afb51bf14054980e4876d164
    platform: linux/amd64
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8080
      - --project=local-rag-project
      - --database-mode=firestore-native
    environment:
      CLOUDSDK_CORE_PROJECT: local-rag-project
      CLOUDSDK_CONFIG: /tmp/gcloud
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:8080/"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    networks: [local-only]
    restart: unless-stopped

  pubsub:
    image: google/cloud-sdk:548.0.0-emulators@sha256:bea47bb520e7247125c20498c00bdcfbf40b2cc0afb51bf14054980e4876d164
    platform: linux/amd64
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=local-rag-project
    environment:
      CLOUDSDK_CORE_PROJECT: local-rag-project
      CLOUDSDK_CONFIG: /tmp/gcloud
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:8085/"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    networks: [local-only]
    restart: unless-stopped

  storage:
    image: fsouza/fake-gcs-server:1.52.3@sha256:666f86b873120818b10a5e68d99401422fcf8b00c1f27fe89599c35236f48b4c
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://storage:4443"]
    ports:
      - "127.0.0.1:4443:4443"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4443/storage/v1/b"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks: [local-only]
    restart: unless-stopped

  vertex:
    build:
      context: ..
      dockerfile: local/emulator/Dockerfile
    environment:
      APP_MODE: local
      LOCAL_EMULATOR_ADMIN_TOKEN: local-emulator-admin-only
      LOCAL_EMULATOR_DB: /data/local-emulator.sqlite3
      PORT: "8090"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - vertex-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/readyz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks: [local-only]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: local/docker/Dockerfile.worker
    environment:
      <<: *runtime-environment
      PORT: "8081"
    extra_hosts: *cloud-endpoint-sinkholes
    configs:
      - source: local-auth
        target: /run/local-auth/local-auth.key
        mode: 0444
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      firestore:
        condition: service_healthy
      pubsub:
        condition: service_healthy
      storage:
        condition: service_healthy
      vertex:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/readyz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [local-only]
    restart: unless-stopped

  push-gateway:
    build:
      context: ..
      dockerfile: local/emulator/Dockerfile
    command: ["python", "/app/push_gateway.py"]
    environment:
      WORKER_PUSH_ENDPOINT: http://worker:8081/v1/pubsub/push
      PUBSUB_WORKER_AUDIENCE: http://worker:8081/
      DEV_TENANT_ID: dev-tenant
      LOCAL_AUTH_SIGNING_KEY_FILE: /run/local-auth/local-auth.key
    configs:
      - source: local-auth
        target: /run/local-auth/local-auth.key
        mode: 0444
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8086/readyz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s
    networks: [local-only]
    restart: unless-stopped

  pubsub-bootstrap:
    image: google/cloud-sdk:548.0.0-emulators@sha256:bea47bb520e7247125c20498c00bdcfbf40b2cc0afb51bf14054980e4876d164
    platform: linux/amd64
    command: ["python3", "/bootstrap/bootstrap_pubsub.py"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: local-rag-project
      PUBSUB_PUSH_ENDPOINT: http://push-gateway:8086/v1/pubsub/push
      PUBSUB_TOPIC: ingestion
      PUBSUB_DLQ_TOPIC: ingestion-dlq
      PUBSUB_SUBSCRIPTION: ingestion-worker
      PUBSUB_DLQ_SUBSCRIPTION: ingestion-dlq-inspect
    volumes:
      - ./scripts/bootstrap_pubsub.py:/bootstrap/bootstrap_pubsub.py:ro
    depends_on:
      pubsub:
        condition: service_healthy
      worker:
        condition: service_healthy
      push-gateway:
        condition: service_healthy
    networks: [local-only]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: local/docker/Dockerfile.api
    environment:
      <<: *runtime-environment
      PORT: "8080"
    extra_hosts: *cloud-endpoint-sinkholes
    configs:
      - source: local-auth
        target: /run/local-auth/local-auth.key
        mode: 0444
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      firestore:
        condition: service_healthy
      storage:
        condition: service_healthy
      vertex:
        condition: service_healthy
      pubsub-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/readyz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [local-only]
    restart: unless-stopped

configs:
  local-auth:
    content: |
      0123456789abcdef0123456789abcdef

volumes:
  storage-data:
  vertex-data:

networks:
  local-only:
    driver: bridge
